services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webgis_pamekasan_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: webgis_pamekasan
      DB_USERNAME: postgres
      DB_PASSWORD: pamekasan_secret
    depends_on:
      - db
    networks:
      - webgis_network

  web:
    image: nginx:alpine
    container_name: webgis_pamekasan_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - webgis_network

  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: webgis_pamekasan_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: webgis_pamekasan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pamekasan_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - webgis_network

networks:
  webgis_network:
    driver: bridge

volumes:
  pgdata:
    driver: local

